<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>梨花祭2026 中夜祭 入場確認</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN",sans-serif;background:#f7f7f5;color:#1a1a1a;min-height:100vh;padding:18px 14px 36px}
    .wrap{max-width:760px;margin:0 auto}.header{margin-bottom:14px}.title{font-size:22px;font-weight:700}.sub{font-size:13px;color:#666;margin-top:4px;line-height:1.5}.notice{background:#fff8e6;border:1px solid #efd77d;border-radius:10px;padding:10px 12px;font-size:13px;color:#6b4a00;line-height:1.6;margin:12px 0}.panel{background:#fff;border:1px solid #e0ddd8;border-radius:14px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f7f7f5;border-radius:10px;padding:10px;text-align:center}.stat .num{font-size:22px;font-weight:700}.stat .label{font-size:12px;color:#666;margin-top:3px}.btn{width:100%;border:0;border-radius:10px;padding:13px 14px;font-size:15px;font-weight:700;cursor:pointer;background:#1a1a1a;color:#fff;margin-top:8px}.btn.secondary{background:#fff;color:#1a1a1a;border:1px solid #d8d6d0}.btn.danger{background:#8f2222}input{width:100%;border:1px solid #d8d6d0;border-radius:10px;padding:12px;font-size:16px;margin-top:8px}label{display:block;font-size:13px;color:#555;margin-top:12px}#reader{width:100%;max-width:520px;margin:0 auto;border-radius:12px;overflow:hidden;background:#111}.result{border-radius:14px;padding:18px;margin:12px 0;text-align:center;border:2px solid #ddd;background:#fff}.result-title{font-size:28px;font-weight:800;margin-bottom:8px}.result-main{font-size:20px;font-weight:700;line-height:1.7}.result-sub{font-size:13px;color:#555;line-height:1.7;margin-top:8px;white-space:pre-wrap}.ok{border-color:#1b8f5a;background:#eefaf4}.ok .result-title{color:#0f6e40}.warn{border-color:#c18416;background:#fff8e6}.warn .result-title{color:#854f0b}.ng{border-color:#bc3a3a;background:#fff2f2}.ng .result-title{color:#a32d2d}.muted{font-size:12px;color:#777;line-height:1.6;margin-top:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.grid,.row{grid-template-columns:1fr}.title{font-size:19px}.result-title{font-size:24px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title">梨花祭2026 中夜祭 入場確認</div>
    <div class="sub">外部ホスト版スキャナー。カメラはこのページで起動し、照合だけGASへ送信します。</div>
  </div>

  <div class="notice" id="configNotice">GAS WebアプリURLを設定してください。</div>

  <div class="panel">
    <div class="grid">
      <div class="stat"><div class="num" id="enteredNum">-</div><div class="label">入場済</div></div>
      <div class="stat"><div class="num" id="reservedNum">-</div><div class="label">予約数</div></div>
      <div class="stat"><div class="num" id="capNum">-</div><div class="label">定員</div></div>
    </div>
  </div>

  <div id="result" class="result warn">
    <div class="result-title">待機中</div>
    <div class="result-main">スキャン開始を押してください</div>
    <div class="result-sub" id="resultSub"></div>
  </div>

  <div class="panel">
    <div id="reader"></div>
    <button class="btn" id="startBtn" onclick="startScanner()">スキャン開始</button>
    <button class="btn danger" id="stopBtn" onclick="stopScanner()" style="display:none">スキャン停止</button>
    <div class="muted">カメラが使えない場合は、下の「QR画像から読み取り」または予約ID手入力を使用。</div>
  </div>

  <div class="panel">
    <div class="row">
      <div>
        <label>予約IDで受付</label>
        <input id="manualId" placeholder="例：RSK-A3F9X2" autocomplete="off">
        <button class="btn secondary" onclick="submitManualId()">予約IDで受付</button>
      </div>
      <div>
        <label>氏名で受付</label>
        <input id="manualName" placeholder="例：千葉 英和" autocomplete="off">
        <button class="btn secondary" onclick="submitName()">氏名で検索</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <label>QR画像から読み取り</label>
    <input type="file" id="qrFile" accept="image/*" capture="environment" onchange="scanFileQr(this.files && this.files[0])">
    <div class="muted">Chromebook/スマホでQRを撮影して読み取れます。ライブカメラが塞がれた時の予備線です。</div>
  </div>
</div>

<script>
// ここだけ自分のGAS WebアプリURLに置き換える。末尾は /exec のURL。
const GAS_WEB_APP_URL = 'PASTE_YOUR_GAS_WEB_APP_EXEC_URL_HERE';
const SCAN_API_TOKEN = 'scan_nUSvFTqmx_Lqft26p6S9muqscoXSyLrc';
const DEVICE_NAME = 'scan-' + Math.random().toString(36).slice(2, 8);

let html5QrCode = null;
let isScanning = false;
let lastText = '';
let lastAt = 0;

function isConfigured() {
  return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(GAS_WEB_APP_URL);
}

function updateConfigNotice() {
  const el = document.getElementById('configNotice');
  if (isConfigured()) {
    el.textContent = '接続先GAS設定済み / 端末ID：' + DEVICE_NAME;
    el.style.display = 'block';
  } else {
    el.textContent = '未設定：HTML内の GAS_WEB_APP_URL を、GAS Webアプリの /exec URL に置き換えてください。';
    el.style.display = 'block';
  }
}
updateConfigNotice();

function jsonp(action, params) {
  return new Promise(function(resolve, reject) {
    if (!isConfigured()) {
      reject(new Error('GAS_WEB_APP_URL is not configured'));
      return;
    }
    const callbackName = '__scanCb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const query = new URLSearchParams(Object.assign({}, params || {}, {
      api: 'scan',
      token: SCAN_API_TOKEN,
      action,
      deviceName: DEVICE_NAME,
      callback: callbackName,
      _: Date.now()
    }));
    const script = document.createElement('script');
    const timer = setTimeout(function() {
      cleanup();
      reject(new Error('GAS API timeout'));
    }, 12000);
    function cleanup() {
      clearTimeout(timer);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[callbackName] = function(data) {
      cleanup();
      resolve(data || {});
    };
    script.onerror = function() {
      cleanup();
      reject(new Error('GAS API load error'));
    };
    script.src = GAS_WEB_APP_URL + '?' + query.toString();
    document.body.appendChild(script);
  });
}

async function startScanner() {
  if (!isConfigured()) {
    setResult('ng', '設定未完了', 'GAS WebアプリURLが未設定です。HTML内の GAS_WEB_APP_URL を置き換えてください。');
    return;
  }
  if (isScanning) return;
  setResult('warn', '起動中', 'カメラを起動しています。');
  html5QrCode = new Html5Qrcode('reader');
  const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
  try {
    await html5QrCode.start({ facingMode: 'environment' }, config, onScanSuccess, function() {});
  } catch (e1) {
    try {
      const cameras = await Html5Qrcode.getCameras();
      if (!cameras || cameras.length === 0) throw new Error('カメラが見つかりません');
      const back = cameras.find(c => /back|rear|environment|背面|後面/i.test(c.label));
      await html5QrCode.start((back || cameras[0]).id, config, onScanSuccess, function() {});
    } catch (e2) {
      setResult('ng', 'カメラ取得失敗', String((e2 && (e2.message || e2)) || e1));
      return;
    }
  }
  isScanning = true;
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'block';
  setResult('warn', 'スキャン待機中', 'QRコードをカメラに向けてください。');
}

async function stopScanner() {
  if (!html5QrCode || !isScanning) return;
  try { await html5QrCode.stop(); } catch(e) {}
  isScanning = false;
  document.getElementById('startBtn').style.display = 'block';
  document.getElementById('stopBtn').style.display = 'none';
  setResult('warn', '停止中', 'スキャンを停止しました。');
}

function onScanSuccess(decodedText) {
  const text = String(decodedText || '').trim().toUpperCase();
  const now = Date.now();
  if (!text || (text === lastText && now - lastAt < 2500)) return;
  lastText = text;
  lastAt = now;
  checkReservationId(text);
}

async function checkReservationId(id) {
  setResult('warn', '照合中', id);
  try {
    const res = await jsonp('checkEntryStatus', { reservationId: id });
    renderApiResult(res);
    refreshSummary();
  } catch (e) {
    setResult('ng', '通信失敗', String(e && (e.message || e)));
  }
}

async function submitManualId() {
  const id = document.getElementById('manualId').value.trim().toUpperCase();
  if (!id) return setResult('ng', '入力不足', '予約IDを入力してください。');
  await checkReservationId(id);
}

async function submitName() {
  const name = document.getElementById('manualName').value.trim();
  if (!name) return setResult('ng', '入力不足', '氏名を入力してください。');
  setResult('warn', '氏名検索中', name);
  try {
    const res = await jsonp('checkEntryByName', { name });
    renderApiResult(res);
    refreshSummary();
  } catch (e) {
    setResult('ng', '通信失敗', String(e && (e.message || e)));
  }
}

async function scanFileQr(file) {
  if (!file) return;
  const scanner = new Html5Qrcode('reader');
  try {
    const text = await scanner.scanFile(file, true);
    onScanSuccess(text);
  } catch (e) {
    setResult('ng', '画像読取失敗', String(e && (e.message || e)));
  }
}

function renderApiResult(res) {
  if (!res || !res.status) return setResult('ng', '不明な応答', JSON.stringify(res));
  if (res.status === 'entry_success') {
    return setResult('ok', '入場OK', (res.name || '') + ' / ' + (res.area || '-') + 'エリア', '予約ID：' + (res.reservationId || '') + '\n受付時刻：' + (res.enteredAt || ''));
  }
  if (res.status === 'already_entered') {
    return setResult('warn', '入場済み', (res.name || '') + ' / ' + (res.area || '-') + 'エリア', 'すでに受付済みです。\n受付時刻：' + (res.enteredAt || '不明'));
  }
  if (res.status === 'not_found') return setResult('ng', '該当なし', '予約IDまたは氏名が見つかりません。');
  if (res.status === 'invalid_ticket') return setResult('ng', '無効チケット', (res.name || '') + ' / ' + (res.area || '-') + 'エリア', '状態：' + (res.reservationStatus || '無効'));
  if (res.status === 'multiple_matches') return setResult('warn', '同姓同名あり', '予約IDで受付してください。', JSON.stringify(res.matches || [], null, 2));
  if (res.status === 'unauthorized') return setResult('ng', '権限なし', 'スキャンAPIトークンが違います。');
  if (res.status === 'lock_error') return setResult('warn', '混雑中', '数秒後にもう一度試してください。');
  if (res.status === 'invalid_format') return setResult('ng', '形式エラー', '予約IDまたは氏名の形式が不正です。');
  setResult('ng', 'エラー', res.status, JSON.stringify(res));
}

function setResult(kind, title, main, sub) {
  const el = document.getElementById('result');
  el.className = 'result ' + kind;
  el.querySelector('.result-title').textContent = title || '';
  el.querySelector('.result-main').textContent = main || '';
  document.getElementById('resultSub').textContent = sub || '';
}

async function refreshSummary() {
  if (!isConfigured()) return;
  try {
    const res = await jsonp('adminGetSummary', {});
    if (res && res.status === 'ok') {
      document.getElementById('enteredNum').textContent = res.totalEntered;
      document.getElementById('reservedNum').textContent = res.totalReserved;
      document.getElementById('capNum').textContent = res.totalCap;
    }
  } catch(e) {}
}
refreshSummary();
setInterval(refreshSummary, 15000);
</script>
</body>
</html>
